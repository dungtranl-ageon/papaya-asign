name: Papaya Monorepo CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Security Audit, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: DevSecOps Security Audit
        run: bash .agents/skills/papaya-devops/scripts/security-audit.sh

      - name: Run Linter
        run: pnpm lint

      - name: Compile Packages & Typecheck
        run: |
          pnpm --filter @papaya/shared build
          pnpm --filter @papaya/mcp-server build

  test-gate:
    name: Contracts, Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Core Packages
        run: |
          pnpm --filter @papaya/shared build
          pnpm --filter @papaya/mcp-server build

      - name: Run Vitest Suite
        run: pnpm test

  container-build-check:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test-gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify API Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: papaya-api:${{ github.sha }}

      - name: Verify Web Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: papaya-web:${{ github.sha }}
