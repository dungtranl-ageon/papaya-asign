services:
  # ----------------------------------------------------------------------------
  # Next.js 15 Assessor Workstation (Frontend)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: papaya_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - papaya_network

  # ----------------------------------------------------------------------------
  # NestJS 10 + Mastra AI Engine (Backend API)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: papaya_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/papaya_claims.db}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://localhost:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      MODEL_NAME: ${MODEL_NAME:-llama3.3}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/claims']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - papaya_network

  # ----------------------------------------------------------------------------
  # PostgreSQL (Opt-in via --profile postgres)
  # Default standalone execution uses lightweight SQLite without zombie containers.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: papaya_postgres
    profiles: ['postgres', 'full']
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: papaya
      POSTGRES_PASSWORD: papaya_secret
      POSTGRES_DB: papaya_claims
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U papaya -d papaya_claims']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - papaya_network

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Encrypted Object Storage for Claim Documents)
  # Run with: docker compose --profile storage up -d
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: papaya_minio
    profiles: ['storage', 'full']
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - papaya_network

  # ----------------------------------------------------------------------------
  # Local Ollama AI Engine (Optional - Profile: ai)
  # Run with: docker compose --profile ai up -d
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: papaya_ollama
    profiles: ['ai', 'full']
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - papaya_network

networks:
  papaya_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  ollama_models:
    driver: local
