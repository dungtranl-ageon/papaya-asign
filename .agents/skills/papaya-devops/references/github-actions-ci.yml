name: Papaya Monorepo CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DevSecOps Security Audit
        run: bash .agents/skills/papaya-devops/scripts/security-audit.sh

      - name: Run Linter
        run: pnpm lint

      - name: Typecheck Entire Monorepo
        run: pnpm build

  test-gate:
    name: Automated Unit, Contract & E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suite (Contract & E2E)
        run: pnpm test

  container-build:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .agents/skills/papaya-devops/references/Dockerfile.api
          push: false
          tags: papaya-api:${{ github.sha }}

      - name: Run Trivy Vulnerability Scan (High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: papaya-api:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
